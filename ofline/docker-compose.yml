services:
  rewriter:
    image: rewriter:offline
    restart: unless-stopped
    environment:
      # ollama — порт 11434; llama — llama-server (llama-cpp-kepler:sm35), обычно порт 8080.
      LLM_BACKEND: "ollama"
      LLM_BASE_URL: "http://192.168.254.20:11434"
      LLM_MODEL: "t-tech/T-lite-it-2.1:q4_K_M"
      LLM_REWRITE_MODEL: "t-tech/T-lite-it-2.1:q4_K_M"
      LLM_PROOFREAD_MODEL: "t-tech/T-lite-it-2.1:q4_K_M"
      LLM_API_KEY: ""
      LLM_TIMEOUT: "600"
      LLM_TEMPERATURE: "0.3"
      LLM_KEEP_ALIVE: "30m"
      # Максимум контекста в токенах. Короткий текст берёт меньше.
      LLM_NUM_CTX: "4096"
      MODEL_ADMIN_KEY: "local-admin"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8181:8181"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
