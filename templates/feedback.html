<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отзывы и идеи</title>
    <link rel="stylesheet" href="/static/style.css?v=33" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/">Рерайтер</a>
      <div class="header-end">
      <nav class="top-nav">
        <a class="nav-btn" href="/">Назад к рерайтеру</a>
        <button type="button" class="nav-btn" id="feedback-admin" {% if not model_choice %}hidden{% endif %}>
          Удаление идей
        </button>
      </nav>
      </div>
    </header>
    <main class="page feedback-page">
      <section class="panel feedback-panel">
        <header class="feedback-intro">
          <h2>Отзывы и идеи</h2>
          <p>Это страница с отзывами и идеями.</p>
        </header>
        <button type="button" id="feedback-open">Отправить идею</button>
        <form id="feedback-form" class="feedback-form" hidden>
          <label for="feedback-name">Имя</label>
          <input id="feedback-name" type="text" maxlength="80" placeholder="Можно не указывать" autocomplete="name" />
          <label for="feedback-text">Отзыв или идея</label>
          <textarea id="feedback-text" maxlength="1000" required placeholder="Напишите здесь"></textarea>
          <div class="feedback-actions">
            <button type="submit" id="feedback-submit">Отправить</button>
            <button type="button" class="ghost" id="feedback-close">Закрыть</button>
          </div>
        </form>
        <p class="form-error" id="feedback-error" hidden></p>
        <div id="feedback-list" class="feedback-list"></div>
        <p class="term-empty" id="feedback-empty" hidden>Пока отзывов и идей нет.</p>
      </section>
    </main>
    <script src="/static/feedback.js?v=23"></script>
    <p class="app-version">версия 2.0</p>
  </body>
</html>
