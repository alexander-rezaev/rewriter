<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рерайтер</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/static/style.css?v=33" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/">Рерайтер</a>
      <div class="header-end">
      <nav class="top-nav top-nav-home">
        <div class="site-meters">
          <button type="button" class="meter app-like" id="app-like" aria-pressed="false" aria-label="Оценка приложения. Нажмите, если нравится">
            <span class="meter-heart" id="app-like-heart" aria-hidden="true">♡</span>
            <span class="meter-copy">
              <span class="meter-label">Оценка</span>
              <span class="meter-value" id="app-like-count">0</span>
              <span class="meter-hint" id="app-like-hint">Нажмите, если нравится</span>
            </span>
          </button>
          <div class="meter">
            <span class="meter-copy">
              <span class="meter-label">Использований</span>
              <span class="meter-value" id="rewrite-count">0</span>
            </span>
          </div>
        </div>
        <div class="nav-actions">
          <button type="button" class="nav-btn" id="model-unlock" {% if not model_choice %}hidden{% endif %}>
            Выбор модели
          </button>
          <a class="nav-btn" id="terms-link" href="/terms">Словарь терминов</a>
          <a class="nav-btn" id="ideas-link" href="/feedback">Идеи</a>
        </div>
      </nav>
      </div>
    </header>
    <main class="page">
      <form id="rewrite-form" class="workspace">
        <section class="panel toolbar">
          <h2>Режим</h2>
          <div class="modes" role="group" aria-label="Режим обработки">
            <button type="button" class="mode-btn is-active" data-mode="rewrite" id="mode-rewrite">
              Переписать
            </button>
            <button type="button" class="mode-btn" data-mode="proofread" id="mode-proofread">
              Проверить орфографию и грамматику
            </button>
            <button type="button" class="mode-btn" data-mode="grammar" id="mode-grammar">
              Падежи и согласование
            </button>
          </div>
          <input type="hidden" name="mode" id="mode-input" value="rewrite" />

          <div id="style-block">
            <h2>Стиль</h2>
            <div class="styles" role="radiogroup" aria-label="Стиль переписывания">
              {% for style in styles %}
              <label class="style-card">
                <input
                  type="radio"
                  name="style"
                  value="{{ style.id }}"
                  {% if loop.first %}checked{% endif %}
                />
                <span {% if style.id == "simple" %}id="style-simple-label"{% endif %}>{{ style.name }}</span>
              </label>
              {% endfor %}
            </div>
          </div>

          <div class="toolbar-actions">
            <label class="model-field" id="model-field" for="model-select" hidden>
              <span>Модель</span>
              <select id="model-select"></select>
            </label>
            <button type="submit" id="rewrite-btn">Переписать</button>
            <button type="button" id="word-btn" hidden>Загрузить Word</button>
            <input id="word-file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
            <button type="button" id="stop-btn" hidden>Остановить</button>
            <span class="hint timer" id="elapsed" hidden></span>
            <p class="hint queue-note" id="queue-note" hidden aria-live="polite"></p>
            <div class="progress" id="progress" hidden>
              <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
              <span class="hint" id="progress-label"></span>
            </div>
          </div>
          <p class="hint" id="model-hint"></p>
          <p class="form-error" id="form-error" hidden></p>
        </section>

        <div class="compare">
          <section class="panel source-panel">
            <div class="panel-head">
              <h2>Исходный текст</h2>
              <span class="hint" id="char-count">0 знаков</span>
            </div>
            <p class="legend legend-spacer" aria-hidden="true">&nbsp;</p>
            <p class="stats stats-spacer" id="stats-spacer" hidden aria-hidden="true">&nbsp;</p>
            <label class="sr-only" id="source-label">Текст для переписывания</label>
            <div
              id="source-text"
              class="source-text"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-labelledby="source-label"
              data-placeholder="Вставьте сюда абзац, статью или служебный текст…"
              data-empty="true"
            ></div>
          </section>

          <section class="panel result-panel">
            <div class="panel-head">
              <h2 id="result-title">Переписанный текст</h2>
              <button type="button" class="ghost" id="copy-btn" hidden>Копировать</button>
            </div>
            <p class="legend" id="result-legend"></p>
            <p class="stats" id="result-stats" hidden></p>
            <div class="result" id="result" aria-live="polite">
              <p class="placeholder">Здесь появится переписанный текст.</p>
            </div>
          </section>
        </div>
      </form>
    </main>
    <script src="/static/highlight.js?v=22"></script>
    <script src="/static/app.js?v=37"></script>
    <p class="app-version">версия 2.0</p>
  </body>
</html>
