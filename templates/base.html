<!DOCTYPE html>
<html lang="ru" data-radius="soft" data-buttons="solid" data-motion>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Рерайтер{% endblock %}</title>
    <meta name="description" content="{% block description %}Рерайтер — локальный сервис команды: переписывает текст в выбранном стиле, проверяет орфографию и согласует падежи.{% endblock %}" />
    <meta name="theme-color" content="#f4fbff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/static/fonts/fonts.css" />
    <link rel="stylesheet" href="/static/style.css?v=40" />
  </head>
  <body class="{% block bodyclass %}{% endblock %}">
    <a class="skip-link" href="#main">К содержанию</a>

    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--a"></span>
      <span class="aurora__blob aurora__blob--b"></span>
      <span class="aurora__blob aurora__blob--c"></span>
      <span class="aurora__blob aurora__blob--d"></span>
      <span class="aurora__sheen"></span>
      <span class="aurora__grain"></span>
    </div>

    <div class="app">
      <aside class="rail">
        <a class="rail__logo" href="/" aria-label="Рерайтер — на главную">
          <span class="rail__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30" focusable="false">
              <rect width="32" height="32" rx="9" fill="currentColor" />
              <path d="M8 10.5h10.5M8 15h8.5M8 19.5h5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
              <path d="M22.4 16.2a4.6 4.6 0 1 0-1.2 5.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
              <path d="m23.3 13.9-1 2.7-2.7-.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="rail__name">Рерайтер</span>
        </a>

        {% set path = request.url.path %}
        <nav class="rail__nav" aria-label="Основное">
          <a class="rail__link" href="/" {% if path == "/" %}aria-current="page"{% endif %}>
            <svg class="rail__ico" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 5.5h8M3.5 10h8M3.5 14.5h4.5" />
              <path d="M14.8 10.4a3.1 3.1 0 1 0-.9 3.4" />
              <path d="m15.2 8.6-.5 2-2-.4" />
            </svg>
            <span class="rail__label">Рерайтер</span>
          </a>
          <a class="rail__link" id="terms-link" href="/terms" {% if path == "/terms" %}aria-current="page"{% endif %}>
            <svg class="rail__ico" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 5.6C8.9 4.6 7.4 4 5.6 4H3.5v11.5h2.1c1.8 0 3.3.6 4.4 1.6 1.1-1 2.6-1.6 4.4-1.6h2.1V4h-2.1c-1.8 0-3.3.6-4.4 1.6Z" />
              <path d="M10 5.6v11.5" />
            </svg>
            <span class="rail__label">Словарь</span>
          </a>
          <a class="rail__link" id="ideas-link" href="/feedback" {% if path == "/feedback" %}aria-current="page"{% endif %}>
            <svg class="rail__ico" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16.5 10.6c0 2.9-2.9 5.2-6.5 5.2-.8 0-1.6-.1-2.3-.3L3.5 17l1-3.4c-.9-.9-1.5-2-1.5-3.2C3 7.5 5.9 5.2 9.5 5.2s7 2.3 7 5.4Z" />
            </svg>
            <span class="rail__label">Идеи</span>
          </a>
        </nav>

        <div class="rail__foot">
          {% block rail_foot %}{% endblock %}
        </div>
      </aside>

      <main id="main" class="main" tabindex="-1">
        <div class="main__in">
          {% block main %}{% endblock %}
          <footer class="foot">
            <p>Рерайтер — внутренний сервис команды</p>
            <p>версия 2.0</p>
          </footer>
        </div>
      </main>
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
